name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # O lockfile traz o `explicai` (peerDependency) do npm.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # O teste de stdio sobe o dist/cli.js, então o build vem antes dos testes.
      - run: npm run build
      - run: npm test
